name: ONNX to RTEN Converter
on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rten-convert
        run: pip install rten-convert

      - name: Convert detection model
        run: rten-convert ch_PP-OCRv4_det_infer.onnx ch_det.rten
      - name: Convert recognition model
        run: rten-convert ch_PP-OCRv4_rec_infer.onnx ch_rec.rten

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rten-models
          path: |
            ch_det.rten
            ch_rec.rten
